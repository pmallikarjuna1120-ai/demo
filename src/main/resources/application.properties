# ===================================================================
# Spring Datasource Configurations (Oracle)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:batch}
spring.datasource.password=${DB_PASSWORD:batch}

# Hikari Connection Pool Settings
spring.datasource.hikari.pool-name=BatchHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

# ===================================================================
# Spring Batch Configurations
# ===================================================================
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# ===================================================================
# Actuator Management Endpoints
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

# ===================================================================
# Logging Levels
# ===================================================================
logging.level.root=INFO
logging.level.org.springframework.batch=INFO
logging.level.org.springframework.jdbc=WARN

# ===================================================================
# Custom Batch Performance Tuning Application Properties
# ===================================================================
# CHANGE THIS LINE (Use a unique prefix like 'app.')
app.batch.chunk-size=${BATCH_CHUNK_SIZE:500}
app.batch.page-size=${BATCH_PAGE_SIZE:1000}
app.batch.worker-threads=${BATCH_WORKER_THREADS:8}
app.batch.queue-capacity=${BATCH_QUEUE_CAPACITY:1000}
app.batch.retry-limit=${BATCH_RETRY_LIMIT:3}
app.batch.skip-limit=${BATCH_SKIP_LIMIT:100}