spring:
  application:
    name: spring-batch-single-reader-multi-thread
  batch:
    jdbc:
      initialize-schema: never
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:batch_user}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 30000

app:
  batch:
    chunk-size: ${BATCH_CHUNK_SIZE:100}
    page-size: ${BATCH_PAGE_SIZE:100}
    worker-threads: ${BATCH_WORKER_THREADS:8}
    queue-capacity: ${BATCH_QUEUE_CAPACITY:500}
    skip-limit: ${BATCH_SKIP_LIMIT:100}
    retry-limit: ${BATCH_RETRY_LIMIT:3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,debug,metrics,prometheus
logging:
  level:
    com.example.batch: DEBUG
    org.springframework.batch: info
    org.springframework.scheduling.concurrent: info
    # root: DEBUG