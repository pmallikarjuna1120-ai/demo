# src/test/resources/application-test.properties

# Force Spring Batch to build framework schema tables
spring.batch.jdbc.initialize-schema=never

# Force standard Spring SQL scripts (like schema.sql) to run
spring.sql.init.mode=always

# H2 Connection Setup
spring.datasource.url=jdbc:h2:mem:batchdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Enable the web-based H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Show SQL queries in the console log terminal
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Show SQL parameter values (binding values) instead of question marks (?)
logging.level.org.hibernate.orm.jdbc.bind=trace
logging.level.org.springframework.jdbc.core.JdbcTemplate=info
# Expose the Prometheus scraper endpoint along with standard health checks
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# 2. FORCE enable the specific Prometheus engine path mapping (Mandatory Fix for 404)
management.endpoint.prometheus.enabled=true
management.endpoint.metrics.enabled=true
# Enable extended metrics collection formats
management.prometheus.metrics.export.enabled=true
management.endpoint.health.probes.enabled=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
